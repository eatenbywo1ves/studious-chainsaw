# Logrotate Configuration for Monitoring Logs
# Place this file in /etc/logrotate.d/ on Linux systems
# Or use it as reference for Windows log rotation tools

# Alert Logs
C:/Users/Corbin/development/monitoring/logs/alerts.log {
    daily                    # Rotate daily
    missingok               # Don't error if log file is missing
    rotate 14               # Keep 14 days of logs
    compress                # Compress rotated logs
    delaycompress          # Delay compression by one rotation cycle
    notifempty             # Don't rotate empty logs
    create 0640 Corbin Corbin  # Create new log file with these permissions
    maxsize 10M            # Rotate if file exceeds 10MB even if not daily
    dateext                # Add date extension to rotated files
    dateformat -%Y%m%d     # Date format: alerts-20251011.log

    # Post-rotation script
    postrotate
        # Signal the monitoring process to reopen log files (if needed)
        # kill -USR1 $(cat /var/run/monitoring.pid) 2>/dev/null || true
    endscript
}

# Monitoring System Logs
C:/Users/Corbin/development/monitoring/monitoring.log {
    daily
    missingok
    rotate 30               # Keep 30 days of system logs
    compress
    delaycompress
    notifempty
    create 0640 Corbin Corbin
    maxsize 50M             # Larger size for system logs
    dateext
    dateformat -%Y%m%d
}

# General pattern for all monitoring logs
C:/Users/Corbin/development/monitoring/logs/*.log {
    daily
    missingok
    rotate 7                # Keep 1 week for general logs
    compress
    delaycompress
    notifempty
    create 0640 Corbin Corbin
    maxsize 10M
    dateext
    dateformat -%Y%m%d

    # Shared configuration
    sharedscripts
    postrotate
        echo "Logs rotated on $(date)" >> C:/Users/Corbin/development/monitoring/logs/rotation.log
    endscript
}

# Configuration Guidelines:
# 1. Test with: logrotate -d /path/to/this/config
# 2. Force rotation: logrotate -f /path/to/this/config
# 3. Check status: cat /var/lib/logrotate/status
#
# For Windows:
# - Use Log Rotation PowerShell scripts or Windows Task Scheduler
# - Consider third-party tools like LogRotateWin
# - Or implement rotation in the application layer (recommended - see log-rotation-config.js)
