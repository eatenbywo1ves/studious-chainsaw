---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ml-sectest-config
  namespace: ml-sectest
  labels:
    app: ml-sectest-framework
data:
  # API Configuration
  API_HOST: "0.0.0.0"
  API_PORT: "8081"
  API_WORKERS: "4"
  API_RELOAD: "false"
  API_TITLE: "ML-SecTest API"
  API_VERSION: "1.0.0"

  # CORS Configuration
  CORS_ALLOWED_ORIGINS: "https://app.example.com,https://dashboard.example.com"
  CORS_ALLOW_CREDENTIALS: "true"
  CORS_MAX_AGE: "600"

  # Rate Limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_WINDOW: "minute"

  # Database Configuration
  DATABASE_TYPE: "sqlite"
  SQLITE_DB_PATH: "/data/ml_sectest.db"

  # Logging Configuration
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  # Scanning Configuration
  SCAN_DEFAULT_TIMEOUT: "300"
  SCAN_MAX_CONCURRENT: "5"
  SCAN_REPORTS_DIR: "/data/reports"

  # Prometheus Metrics
  METRICS_ENABLED: "true"
  METRICS_PORT: "9090"

  # Environment
  ENVIRONMENT: "production"
  DEBUG: "false"
