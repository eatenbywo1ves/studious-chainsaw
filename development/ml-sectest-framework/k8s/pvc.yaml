---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-sectest-data
  namespace: ml-sectest
  labels:
    app: ml-sectest-framework
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # Optional: Specify storage class for cloud providers
  # storageClassName: standard  # GKE
  # storageClassName: gp2        # EKS
  # storageClassName: default    # AKS
