---
# TLS Certificate Secret Template
# Create using cert-manager or manually:
# kubectl create secret tls catalytic-tls \
#   --cert=path/to/tls.crt \
#   --key=path/to/tls.key \
#   -n catalytic-production
apiVersion: v1
kind: Secret
metadata:
  name: catalytic-tls
  namespace: catalytic-production
  labels:
    environment: production
type: kubernetes.io/tls
stringData:
  # REPLACE with actual certificate and key
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_YOUR_CERTIFICATE
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_YOUR_PRIVATE_KEY
    -----END PRIVATE KEY-----
