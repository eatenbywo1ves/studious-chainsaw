# ========================================
# Secrets Template
# IMPORTANT: These are TEMPLATES with placeholder values
# In production, create secrets using:
#   kubectl create secret generic <name> --from-literal=key=value
# Or use external secret management (Vault, AWS Secrets Manager, etc.)
# ========================================

# STAGING SECRETS
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: catalytic-staging
  labels:
    app: postgres
    environment: staging
type: Opaque
stringData:
  # REPLACE THESE VALUES IN PRODUCTION
  username: catalytic_staging
  password: CHANGE_ME_STAGING_DB_PASSWORD
  # Example command to create:
  # kubectl create secret generic postgres-credentials \
  #   --from-literal=username=catalytic_staging \
  #   --from-literal=password=$(openssl rand -base64 32) \
  #   -n catalytic-staging

---
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: catalytic-staging
  labels:
    app: redis
    environment: staging
type: Opaque
stringData:
  # REPLACE THESE VALUES IN PRODUCTION
  password: CHANGE_ME_STAGING_REDIS_PASSWORD
  # Example command to create:
  # kubectl create secret generic redis-credentials \
  #   --from-literal=password=$(openssl rand -base64 32) \
  #   -n catalytic-staging

---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secrets
  namespace: catalytic-staging
  labels:
    app: saas-api
    environment: staging
type: Opaque
stringData:
  # REPLACE THESE VALUES IN PRODUCTION
  jwt-secret: CHANGE_ME_STAGING_JWT_SECRET_MIN_32_CHARS
  # For RS256, you need private/public key pair:
  # jwt-private-key: |
  #   -----BEGIN PRIVATE KEY-----
  #   ... your private key here ...
  #   -----END PRIVATE KEY-----
  # jwt-public-key: |
  #   -----BEGIN PUBLIC KEY-----
  #   ... your public key here ...
  #   -----END PUBLIC KEY-----
  # Example command to generate RSA key pair:
  # ssh-keygen -t rsa -b 4096 -m PEM -f jwt-key
  # kubectl create secret generic jwt-secrets \
  #   --from-file=jwt-private-key=jwt-key \
  #   --from-file=jwt-public-key=jwt-key.pub \
  #   -n catalytic-staging

---
apiVersion: v1
kind: Secret
metadata:
  name: api-keys
  namespace: catalytic-staging
  labels:
    environment: staging
type: Opaque
stringData:
  # REPLACE THESE VALUES IN PRODUCTION
  catalytic-api-key: CHANGE_ME_STAGING_API_KEY
  webhook-signing-secret: CHANGE_ME_STAGING_WEBHOOK_SECRET

