# ========================================
# HorizontalPodAutoscaler (HPA)
# Automatic scaling based on CPU and memory usage
# Requires metrics-server to be installed
# ========================================

---
# Catalytic API HPA - Staging
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalytic-api-hpa
  namespace: catalytic-staging
  labels:
    app: catalytic-api
    environment: staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalytic-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 4
        periodSeconds: 30
      selectPolicy: Max

