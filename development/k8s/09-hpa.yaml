---
# PodDisruptionBudget for High Availability
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: catalytic-api-pdb
  namespace: catalytic-production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: catalytic-api

